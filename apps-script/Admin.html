<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base target="_top"><title>MATA HATI — Admin CMS</title>
<style>
:root{--bg:#071a2b;--panel:#102d43;--a:#38d9b6;--t:#f5fbff;--m:#a9c0d1}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(145deg,#071a2b,#0b2237);color:var(--t)}.wrap{max-width:1100px;margin:auto;padding:20px}.head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:18px}.brand{font-weight:800;font-size:22px;letter-spacing:.12em}.sub{color:var(--m);font-size:12px;margin-top:4px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab,button{border:1px solid #ffffff20;background:#ffffff0d;color:white;border-radius:12px;padding:10px 14px;cursor:pointer;font:inherit}.tab.active,.primary{background:var(--a);color:#062238;border-color:transparent;font-weight:800}.panel{background:#ffffff08;border:1px solid #ffffff14;border-radius:20px;padding:18px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#ffffff08;border-radius:16px;padding:15px}.stat b{display:block;font-size:26px}.muted{color:var(--m);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:var(--m);font-size:13px;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #ffffff20;background:#071a2b;color:white;border-radius:12px;padding:11px;font:inherit}textarea{min-height:180px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.danger{background:#ff6b6b20;color:#ffb0b0}.list{display:grid;gap:10px}.item{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#ffffff08;border:1px solid #ffffff12;border-radius:15px;padding:12px}.item h3{margin:0 0 4px;font-size:15px}.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#38d9b620;color:var(--a)}.preview{max-width:180px;max-height:120px;border-radius:10px;display:none;margin-top:8px}.toast{position:fixed;right:18px;bottom:18px;background:#0b1e30;border:1px solid #ffffff20;border-radius:12px;padding:12px 15px;display:none;z-index:10}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div class="wrap">
<header class="head"><div><div class="brand">♥ MATA HATI</div><div class="sub">CMS Admin — kelola konten tanpa menyentuh kode</div></div><button onclick="setup()">⚙️ Siapkan Database</button></header>
<div class="tabs"><button class="tab active" id="tabDash" onclick="showTab('dash')">📊 Dashboard</button><button class="tab" id="tabEdit" onclick="showTab('edit')">✍️ Tambah / Edit</button><button class="tab" id="tabList" onclick="showTab('list')">📚 Semua Konten</button></div>
<section id="dash" class="panel"><div class="stats"><div class="stat"><span class="muted">Total</span><b id="sTotal">0</b></div><div class="stat"><span class="muted">Publik</span><b id="sPub">0</b></div><div class="stat"><span class="muted">Draft</span><b id="sDraft">0</b></div><div class="stat"><span class="muted">Video</span><b id="sVideo">0</b></div></div><div style="margin-top:16px" class="muted" id="configInfo">Tekan "Siapkan Database" untuk membuat Sheets + Drive.</div></section>
<section id="edit" class="panel" style="display:none"><h2 id="formTitle">Tambah Konten</h2><form id="form" onsubmit="save(event)"><input type="hidden" id="ID"><div class="grid">
<div><label>Judul</label><input id="Judul" required></div><div><label>Kategori</label><select id="Kategori"><option>Inspirasi</option><option>Cerita</option><option>Kepedulian</option><option>Pengetahuan</option><option>Ruang Tumbuh</option><option>Suara Hati</option><option>Berita</option></select></div>
<div><label>Tanggal</label><input id="Tanggal" type="date"></div><div><label>Penulis</label><input id="Penulis" value="MATA HATI"></div>
<div class="full"><label>Ringkasan</label><textarea id="Ringkasan" style="min-height:90px"></textarea></div><div class="full"><label>Isi artikel</label><textarea id="Isi" required></textarea></div>
<div><label>Status</label><select id="Status"><option>PUBLIK</option><option>DRAFT</option></select></div><div><label>URL Video YouTube (opsional)</label><input id="VideoURL" placeholder="https://www.youtube.com/watch?v=..."></div>
<div class="full"><label>Foto / gambar utama (opsional)</label><input id="Media" type="file" accept="image/*,video/*"><img id="preview" class="preview"></div>
</div><div class="actions"><button class="primary" type="submit">💾 Simpan Konten</button><button type="button" onclick="resetForm()">Bersihkan</button></div></form></section>
<section id="list" class="panel" style="display:none"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>Semua Konten</h2><button onclick="load()">↻ Muat Ulang</button></div><div id="items" class="list">Memuat...</div></section>
</div><div id="toast" class="toast"></div>
<script>
let DATA=[];const $=id=>document.getElementById(id);
function showTab(t){['dash','edit','list'].forEach(x=>$(x).style.display=x===t?'block':'none');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('active')}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2500)}
function setup(){google.script.run.withSuccessHandler(r=>{$('configInfo').innerHTML='Spreadsheet: <a target="_blank" href="'+r.sheetUrl+'">buka</a> · Folder media: <a target="_blank" href="'+r.folderUrl+'">buka</a>';toast('Database siap.');load()}).withFailureHandler(e=>toast(e.message)).setupProject()}
function load(){google.script.run.withSuccessHandler(r=>{DATA=r||[];renderStats();renderList()}).withFailureHandler(e=>toast(e.message)).listAll()}
function renderStats(){$('sTotal').textContent=DATA.length;$('sPub').textContent=DATA.filter(x=>x.Status==='PUBLIK').length;$('sDraft').textContent=DATA.filter(x=>x.Status==='DRAFT').length;$('sVideo').textContent=DATA.filter(x=>x.VideoURL).length}
function renderList(){$('items').innerHTML=DATA.length?DATA.slice().reverse().map(x=>'<div class="item"><div><h3>'+esc(x.Judul)+'</h3><span class="muted">'+esc(x.Kategori)+' · '+esc(x.Tanggal)+' · </span><span class="badge">'+esc(x.Status)+'</span></div><div class="actions"><button onclick="edit(\''+esc(x.ID)+'\')">Edit</button><button class="danger" onclick="del(\''+esc(x.ID)+'\')">Hapus</button></div></div>').join(''):'Belum ada konten.'}
function edit(id){const x=DATA.find(a=>a.ID===id);if(!x)return;showTab('edit');['ID','Judul','Kategori','Tanggal','Penulis','Ringkasan','Isi','Status','VideoURL'].forEach(k=>$(k).value=x[k]||'');$('formTitle').textContent='Edit Konten';window.scrollTo({top:0,behavior:'smooth'})}
function del(id){if(!confirm('Hapus konten ini?'))return;google.script.run.withSuccessHandler(r=>{toast(r.message);load()}).withFailureHandler(e=>toast(e.message)).deleteContent(id)}
function resetForm(){$('form').reset();$('ID').value='';$('Penulis').value='MATA HATI';$('preview').style.display='none';$('formTitle').textContent='Tambah Konten'}
function save(ev){ev.preventDefault();const file=$('Media').files[0];const send=data=>google.script.run.withSuccessHandler(r=>{toast(r.message);resetForm();load();showTab('list')}).withFailureHandler(e=>toast(e.message)).saveContent(data);const data={ID:$('ID').value,Judul:$('Judul').value,Kategori:$('Kategori').value,Tanggal:$('Tanggal').value,Penulis:$('Penulis').value,Ringkasan:$('Ringkasan').value,Isi:$('Isi').value,Status:$('Status').value,VideoURL:$('VideoURL').value};if(!file){send(data);return}if(file.size>8*1024*1024){toast('File terlalu besar. Gunakan gambar < 8 MB.');return}const rd=new FileReader();rd.onload=()=>{data.file={name:file.name,mimeType:file.type,base64:String(rd.result).split(',')[1]};send(data)};rd.readAsDataURL(file)}
$('Media').addEventListener('change',()=>{const f=$('Media').files[0];if(!f)return;const p=$('preview');p.src=URL.createObjectURL(f);p.style.display='block'});$('Tanggal').value=new Date().toISOString().slice(0,10);load();
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
